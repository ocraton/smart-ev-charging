# ============================================================================================
# Orchestrazione dell'intera piattaforma Smart EV-Charging & Grid Optimizer.
#
# Convenzione sulle porte host. I servizi stateless, replicabili con "--scale", NON dichiarano
# ne "container_name" ne una porta host fissa: entrambi devono essere univoci su Docker, quindi
# la loro presenza farebbe fallire la creazione della seconda replica. Per questi servizi si
# dichiara la sola porta del container e Docker assegna una porta host libera a ogni replica,
# scopribile con "docker compose port <servizio> <porta-container>".
#
# Restano a porta fissa solo i tre componenti che devono essere raggiungibili a un indirizzo
# noto: il registro, il Gateway (che il frontend contatta su localhost:9000) e il frontend stesso.
# L'energy-prosumer e a porta fissa per una ragione diversa e piu interessante: e l'unico
# servizio stateful del sistema (i ticket di FLOW-02 vivono in memoria), quindi non e replicabile
# senza uno storage condiviso esterno.
# ============================================================================================

services:
  # 1. Il Service Registry. Nodo singolo per definizione: e il punto di rendez-vous di tutti
  #    gli altri servizi, che lo raggiungono all'hostname stabile "eureka-server".
  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - TZ=Europe/Rome
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - smart-charging-network

  # 2. L'API Gateway. Porta host fissa perche e l'indirizzo pubblico del sistema, cablato nel
  #    frontend. In produzione si scalerebbe mettendogli davanti un bilanciatore di livello 4.
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: api-gateway
    container_name: api-gateway
    ports:
      - "9000:9000"
    environment:
      - TZ=Europe/Rome
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - smart-charging-network

  # 3. Il Tariff Provider. Stateless e replicabile: e il servizio con il fan-in piu alto
  #    dell'architettura, perche interrogato da entrambi i prosumer e coinvolto in tutti i flussi.
  #    docker compose up -d --scale tariff-provider=2
  tariff-provider:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: tariff-provider
    ports:
      - "8081"
    environment:
      - TZ=Europe/Rome
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - smart-charging-network

  # 4. Lo Station Provider (SOAP). Stateless e replicabile.
  station-provider:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: station-provider
    ports:
      - "8083"
    environment:
      - TZ=Europe/Rome
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - smart-charging-network

  # 5. Il Vehicle Provider. Stateless e replicabile.
  vehicle-provider:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: vehicle-provider
    ports:
      - "8082"
    environment:
      - TZ=Europe/Rome
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - smart-charging-network

  # 6. L'Energy Prosumer. Unico servizio STATEFUL: i ticket di FLOW-02 sono in una
  #    ConcurrentHashMap in-process. Replicarlo romperebbe il polling, perche il client
  #    potrebbe avviare la simulazione su un'istanza e interrogarne un'altra. Resta quindi
  #    a istanza singola con porta host fissa, come scelta consapevole e documentata.
  energy-prosumer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: energy-prosumer
    container_name: energy-prosumer
    ports:
      - "8084:8084"
    environment:
      - TZ=Europe/Rome
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - smart-charging-network

  # 7. Il Charging Orchestrator. Stateless e replicabile: non conserva nulla fra due richieste,
  #    usa solo dati di integrazione a breve vita.
  charging-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: charging-orchestrator
    ports:
      - "8085"
    environment:
      - TZ=Europe/Rome
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - smart-charging-network

  # 8. Frontend UI Vue, servito da Nginx. Porta host fissa: e l'indirizzo che apre l'utente.
  frontend-ui:
    build:
      context: ./frontend-ui
    container_name: frontend-ui
    ports:
      - "8080:80"
    networks:
      - smart-charging-network

networks:
  smart-charging-network:
    driver: bridge
